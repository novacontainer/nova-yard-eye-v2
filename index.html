<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yard Eye">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5C2E0E">
<title>NOVA Yard Eye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--navy:#5C2E0E;--navy2:#7A3E14;--rust:#D9731E;--gold:#C9962B;--bg:#F7F1E7;--paper:#fff;--ink:#2B1D12;--muted:#7A6A5C;--line:#EADFCF;--good:#1D9E75;--good-soft:#E1F5EE;--warn:#B8760F;--warn-soft:#FBEFD6;--bad:#A32D2D;--bad-soft:#FCEBEB;--info:#B4560F;--info-soft:#FDEBDD;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;overscroll-behavior:none}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button.primary{background:var(--navy);color:#fff;font-weight:700}
button.accent{background:var(--rust);color:#fff;font-weight:700}
button.good{background:var(--good);color:#fff;font-weight:700}
button.ghost{background:transparent;box-shadow:none;color:var(--muted)}
button.danger{background:var(--bad-soft);color:var(--bad)}
button:disabled{opacity:.45}
button.big{padding:18px;font-size:19px;border-radius:16px;width:100%}
button.xl{padding:22px;font-size:22px;border-radius:18px;width:100%}
input,select,textarea{font-family:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.hdr{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 60%,var(--rust) 100%);color:#fff;border-bottom:4px solid var(--gold);padding:calc(8px + var(--sat)) 12px 8px;display:flex;align-items:center;gap:10px}
.hdr .lg{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hdr .lg img{height:28px;display:block}
.hdr .cap{font-size:10px;color:var(--gold);letter-spacing:1.5px;font-weight:600;white-space:nowrap}
.hdr .t{font-weight:700;color:#fff;line-height:1.15;font-size:17px;white-space:nowrap}
.hdr .ver{margin-left:6px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:#1a7f5a;color:#fff;vertical-align:middle}
.hdr .sp{flex:1}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gold);color:var(--navy);white-space:nowrap}
.pill.q{background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.pill.q.bad{background:var(--bad);color:#fff}
.pill.q.ok{background:var(--good);color:#fff}
@media (max-width:600px){.hdr{gap:8px;padding-left:10px;padding-right:10px}.hdr .cap{font-size:9px;letter-spacing:1px}.hdr .t{font-size:15px}.hdr .lg{padding:2px 6px}.hdr .lg img{height:24px}.hdr .ver{display:none}}
.wrap{padding:14px 14px calc(24px + var(--sab));max-width:640px;margin:0 auto}
.admin .wrap{max-width:1100px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
.card.bad{border-color:var(--bad);background:var(--bad-soft)}
h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}
.no{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.05em}
.li .no{font-size:17px}
.tag{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.g{background:var(--good-soft);color:var(--good)}.tag.y{background:var(--warn-soft);color:var(--warn)}.tag.r{background:var(--bad-soft);color:var(--bad)}.tag.n{background:var(--info-soft);color:var(--info)}.tag.k{background:#eee;color:#555}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:64vh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;left:5%;right:5%;top:40%;height:17%;border:3px dashed rgba(255,255,255,.85);border-radius:10px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
.cam .guide:after{content:'ให้เบอร์ตู้อยู่ในกรอบ';position:absolute;left:0;right:0;top:-28px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.cam .lbl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam .cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.cam .fileless{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;gap:10px;padding:20px;text-align:center}
.shutter{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 0}
.shutter .btn{width:80px;height:80px;border-radius:50%;background:#fff;border:6px solid #cfd6dd;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:0}
.shutter .btn:active{transform:scale(.94)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.th{position:relative;flex:0 0 auto;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#ddd;border:2px solid transparent}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .b{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:2px 4px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.th .x{position:absolute;right:0;top:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;padding:4px 7px;border-radius:0 0 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:15px;max-width:92vw;text-align:center}
.big{font-size:34px;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.1em;text-align:center;padding:8px 0;word-break:break-all}
.big.s{font-size:26px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.overlay img{max-height:38vh;max-width:90vw;border-radius:12px;margin-bottom:16px}
.spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + var(--sab));width:100%;max-width:640px;max-height:88vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#eee}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 14px}
.tabs button.on{background:var(--gold);color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.kbd{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:6px 0}
.kbd span{display:block;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:20px;padding:8px 0;border:2px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
.kbd span.on{border-color:var(--navy)}
.kbd span.ok{border-color:var(--good);background:var(--good-soft)}
.kbd span.bad{border-color:var(--bad);background:var(--bad-soft)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:24px;color:var(--navy)}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio input{width:auto;margin-top:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="hdr">
  <div class="lg"><img id="logo" alt="NOVA"><b id="logoTxt" style="color:#5C2E0E;font-size:15px;letter-spacing:1px" hidden>NOVA</b></div>
  <div><div class="cap">NOVA CONTAINER · <span id="branchCap">QC</span></div><div class="t">NOVA Yard Eye<span class="ver" id="verBadge">v2</span></div></div>
  <div class="sp"></div>
  <span class="pill q" id="qPill" hidden></span>
  <span class="pill" id="namePill" hidden></span>
</div>
<div id="app" class="wrap"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden></div>

<script>
var LOGO_NOVA = ''; // โลโก้จริงโหลดจากหลังบ้าน (getBootstrap → logo) แล้วจำไว้ในเครื่อง

(function(){ var l=LOGO_NOVA||ls('ye_logo')||''; var im=document.getElementById('logo'); if(l){ im.src=l; } else { im.hidden=true; document.getElementById('logoTxt').hidden=false; } })();
function setLogo(dataUrl){ if(!dataUrl) return; try{ ls('ye_logo',dataUrl); }catch(e){} var im=document.getElementById('logo'); im.src=dataUrl; im.hidden=false; document.getElementById('logoTxt').hidden=true; }

/* ================================================================== config ================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbwEroBi0p3vnCZdr8kDeWd25GtsPRE0r4UeW4TsL97LxmN8sr6LQDe9fQjpgG9sKw5fHQ/exec';               // URL /exec ของ Apps Script (build script ใส่ให้)
var APP_VER = '2.0.0';
var TESS_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
document.getElementById('verBadge').textContent = 'v' + APP_VER;

/* ================================================================== helpers ================================================================== */
function $(id){ return document.getElementById(id); }
function h(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} return null; }
function p2(n){ return (n<10?'0':'')+n; }
function nowTxt(d){ d=d||new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
function stamp(d){ d=d||new Date(); return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds()); }
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
var toastT;
function toast(msg,ms){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},ms||2400); }
function overlay(html){ var o=$('overlay'); if(!html){ o.hidden=true; o.innerHTML=''; return; } o.innerHTML=html; o.hidden=false; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function ask(msg){ return Promise.resolve(window.confirm(msg)); }
function loadScript(src){ return new Promise(function(res,rej){ if(document.querySelector('script[src="'+src+'"]')) return res(); var s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=function(){ rej(new Error('โหลดไม่ได้: '+src)); }; document.head.appendChild(s); }); }

// เรียกหลังบ้าน: ผ่าน google.script.run ถ้าเปิดจาก Apps Script ไม่งั้นยิง HTTP ไปที่ API_URL (ลองซ้ำเองเมื่อเน็ตสะดุด)
function gs(fn){
  var args=Array.prototype.slice.call(arguments,1);
  if(window.google && google.script && google.script.run){
    return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e); }); r[fn].apply(r,args); });
  }
  var body=JSON.stringify({fn:fn,args:args,token:ls('ye_tok')||''});
  var maxTry=(fn==='uploadPhoto'||fn==='finishContainer')?1:3;
  function once(n){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'server error'); return j.result; })
      .catch(function(e){ var m=String(e.message||e); if(/^AUTH:/.test(m)){ ls('ye_tok',null); }
        var retry=/Failed to fetch|NetworkError|Load failed|HTTP 5\d\d|HTTP 404|HTTP 429|Unexpected token|JSON/.test(m);
        if(retry && n<maxTry) return sleep(1500*n).then(function(){ return once(n+1); }); throw e; });
  }
  return once(1);
}

/* ---- ISO 6346 ---- */
var LV={A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
function cleanNo(no){ return String(no||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function validNo(no){ no=cleanNo(no); if(!/^[A-Z]{4}\d{7}$/.test(no)) return false; var s=0; for(var i=0;i<10;i++){ var c=no.charAt(i); var v=i<4?LV[c]:parseInt(c,10); if(v===undefined) return false; s+=v*Math.pow(2,i);} var cd=s%11; if(cd===10) cd=0; return cd===parseInt(no.charAt(10),10); }
// แก้ตัวที่สับสนตามตำแหน่ง แล้วคืนเบอร์ 11 ตัว
var L2={'0':'O','1':'I','5':'S','8':'B','2':'Z','6':'G','4':'A','7':'T'}, D2={'O':'0','I':'1','L':'1','S':'5','B':'8','Z':'2','G':'6','Q':'0','D':'0','T':'7','A':'4'};
function normNo(s){ s=cleanNo(s); if(s.length!==11) return s; var o=''; for(var i=0;i<11;i++){ var c=s.charAt(i); o+= i<4?(L2[c]||c):(D2[c]||c); } return o; }

/* ================================================================== state ================================================================== */
var S={
  name: ls('ye_name')||'',
  boot: null,                       // จากเซิร์ฟเวอร์: staff, reader, hasKey, wmPos, maxPx, jpegQ
  screen: 'home',
  session: null,                    // {sid,no,source,reader:{},photos:[],numberPhoto,folderId}
  today: null,
  cam: {stream:null, ok:false},
  admin: false, adminTab: 'today', tok: ls('ye_tok')||''
};
var isAdminUrl = /[?#&]admin/.test(location.search+location.hash);
if(isAdminUrl || (window.innerWidth>=900 && window.innerHeight>=600 && !ls('ye_forceMobile'))) S.admin=true;

/* ================================================================== camera ================================================================== */
async function startCam(videoEl){
  if(S.cam.stream){ videoEl.srcObject=S.cam.stream; try{await videoEl.play();}catch(e){} return true; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ S.cam.ok=false; return false; }
  try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
    S.cam.stream=st; S.cam.ok=true; videoEl.srcObject=st; await videoEl.play(); return true;
  }catch(e){ S.cam.ok=false; return false; }
}
function stopCam(){ if(S.cam.stream){ S.cam.stream.getTracks().forEach(function(t){t.stop();}); S.cam.stream=null; } }
function grabFrame(v){ var c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); return c; }
async function fileToCanvas(file){
  var bmp=null;
  try{ if(window.createImageBitmap) bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=null; }
  if(bmp){ var c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height; c.getContext('2d').drawImage(bmp,0,0); bmp.close&&bmp.close(); return c; }
  return new Promise(function(res,rej){ var url=URL.createObjectURL(file); var img=new Image(); img.onload=function(){ var c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url); res(c); }; img.onerror=function(){ rej(new Error('อ่านรูปไม่ได้')); }; img.src=url; });
}
var pendingFileCb=null;
function pickFile(){ return new Promise(function(res){ pendingFileCb=res; $('fileIn').value=''; $('fileIn').click(); }); }
$('fileIn').addEventListener('change',function(){ var f=this.files&&this.files[0]; var cb=pendingFileCb; pendingFileCb=null; if(cb) cb(f||null); });
// ถ่าย 1 เฟรม (กล้องสด หรือกล้องเครื่องเมื่อกล้องสดใช้ไม่ได้)
async function captureCanvas(){
  var v=$('vid');
  if(S.cam.ok && v && v.videoWidth) return grabFrame(v);
  var f=await pickFile(); if(!f) return null;
  return fileToCanvas(f);
}
function canvasToBlob(c,q){ return new Promise(function(res){ c.toBlob(function(b){ res(b); },'image/jpeg',q); }); }
// ย่อรูป + ลายน้ำ → {blob, thumb, w, h}
async function processPhoto(src, wmLines){
  var b=S.boot||{}; var maxPx=b.maxPx||1600, q=b.jpegQ||0.82, pos=b.wmPos||'bl';
  var sc=Math.min(1, maxPx/Math.max(src.width,src.height));
  var w=Math.round(src.width*sc), hh=Math.round(src.height*sc);
  var c=document.createElement('canvas'); c.width=w; c.height=hh; var ctx=c.getContext('2d'); ctx.drawImage(src,0,0,w,hh);
  var fs=Math.max(15,Math.round(w*0.026)); ctx.font='700 '+fs+'px Sarabun, Arial, sans-serif'; ctx.textBaseline='bottom';
  var pad=Math.round(fs*0.6), lh=Math.round(fs*1.2);
  var lines=(wmLines||[]).filter(Boolean);
  for(var i=0;i<lines.length;i++){
    var txt=lines[i]; var tw=ctx.measureText(txt).width;
    var x=pos.indexOf('r')>=0 ? w-tw-pad : pad;
    var y=pos.indexOf('t')>=0 ? fs+pad+i*lh : hh-pad-(lines.length-1-i)*lh;
    ctx.lineWidth=Math.max(2,fs/6); ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(txt,x,y); ctx.fillStyle='#fff'; ctx.fillText(txt,x,y);
  }
  var blob=await canvasToBlob(c,q);
  var t=document.createElement('canvas'); var ts=Math.min(1,240/Math.max(w,hh)); t.width=Math.round(w*ts); t.height=Math.round(hh*ts); t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  return {blob:blob, thumb:t.toDataURL('image/jpeg',0.6), w:w, h:hh};
}
function blobToB64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]); }; r.onerror=rej; r.readAsDataURL(blob); }); }
// ตัดเฉพาะบริเวณกรอบเล็ง (ตรงกับ .guide ใน CSS: left 5% right 5% top 40% height 17%) เผื่อขอบเล็กน้อย
function cropGuide(src, boxAspect){
  var vw=src.width, vh=src.height;
  if(!boxAspect){ var sc0=Math.min(1,1600/Math.max(vw,vh)); var c0=document.createElement('canvas'); c0.width=Math.round(vw*sc0); c0.height=Math.round(vh*sc0); c0.getContext('2d').drawImage(src,0,0,c0.width,c0.height); return c0; }
  // ส่วนที่มองเห็นจริงบนจอ (video ใช้ object-fit:cover) — boxAspect = กว้าง/สูง ของกล่องกล้อง
  var ba=boxAspect||0.75; var visW=Math.min(vw, vh*ba), visH=Math.min(vh, vw/ba); var ox=(vw-visW)/2, oy=(vh-visH)/2;

var OCR={worker:null, loading:null, ready:false, err:''};
function ocrInit(){

// หาเบอร์ตู้ที่ check digit ผ่านจากข้อความ OCR; คืน {no,valid,raw} (valid=false = เจอรูปแบบคล้ายเบอร์แต่ไม่ผ่าน)
function extractNo(text){
  var lines=String(text||'').toUpperCase().split(/\n+/).map(function(l){ return l.replace(/[^A-Z0-9]/g,''); }).filter(Boolean);
  var cands=lines.slice(); cands.push(lines.join(''));
  for(var k=0;k<lines.length-1;k++) cands.push(lines[k]+lines[k+1]);
  var near=null;
  for(var c=0;c<cands.length;c++){
    var s=cands[c];
    for(var i=0;i+11<=s.length;i++){
      var w=normNo(s.substr(i,11));
      if(!/^[A-Z]{4}\d{7}$/.test(w)) continue;
      if(validNo(w)) return {no:w,valid:true,raw:s.substr(i,11)};
      if(!near && /U$/.test(w.substr(0,4))) near={no:w,valid:false,raw:s.substr(i,11)};
    }
  }
  return near;
}
// หา "10 ตัวแรก" (4 ตัวอักษร + 6 ตัวเลข) จากคำที่ OCR อ่านได้ พร้อมกรอบของคำตัวเลข — ใช้เมื่อหลักตรวจสอบในกรอบสี่เหลี่ยมถูก OCR ทิ้งไป
function findPrefix(words){
  words=(words||[]).filter(function(w){ return /[A-Z0-9]/i.test(w.text||''); });
  for(var i=0;i<words.length;i++){
    var a=cleanNo(words[i].text);
    // แบบคำเดียว "DRYU309678" หรือ "DRYU3096781"
    var m=a.match(/^([A-Z0-9]{4})(\d{6})/); if(m && a.length<=11){ var p=normNo(m[1]+m[2]+'0').substr(0,10); if(/^[A-Z]{4}\d{6}$/.test(p)) return {prefix:p,bbox:words[i].bbox}; }
    // แบบสองคำ "DRYU" + "309678"
    if(i+1<words.length){ var b=cleanNo(words[i+1].text); if(a.length===4 && /^\d{6}$/.test(normNo(a+b+'0').substr(4,6))){ var p2=normNo(a+b+'0').substr(0,10); if(/^[A-Z]{4}\d{6}$/.test(p2)) return {prefix:p2,bbox:words[i+1].bbox}; } }

}
// ลบชิ้นส่วนที่ใหญ่ผิดขนาดตัวอักษร (เส้นกรอบสี่เหลี่ยมของหลักตรวจสอบ) ออกจากรูปเล็ก ๆ ก่อนอ่านตัวเลขเดี่ยว
function stripBox(cv, charH){
  var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height; var im=ctx.getImageData(0,0,W,H), d=im.data;
  var bin=new Uint8Array(W*H), dark=0, i;
  for(i=0;i<W*H;i++){ bin[i]=d[i*4]<128?1:0; dark+=bin[i]; }

    if(bin[s]!==fg||lab[s]) continue; id++; var minx=W,maxx=0,miny=H,maxy=0,px=[]; stack.push(s); lab[s]=id;
    while(stack.length){ var q=stack.pop(); px.push(q); var x=q%W,y=(q-x)/W; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      var nb=[q-1,q+1,q-W,q+W]; for(var k=0;k<4;k++){ var t=nb[k]; if(t<0||t>=W*H) continue; if(k<2 && ((t%W)-x)*((t%W)-x)>1) continue; if(bin[t]===fg&&!lab[t]){ lab[t]=id; stack.push(t); } } }
    comps.push({px:px,w:maxx-minx+1,h:maxy-miny+1,minx:minx,maxx:maxx,miny:miny,maxy:maxy});
  }
  comps.forEach(function(c){
    var big=c.h>charH*1.35||c.w>charH*1.25; var edge=(c.minx<=1&&c.maxx>=W-2)||(c.miny<=1&&c.maxy>=H-2); var tiny=c.px.length<charH*0.6;
    if(big||edge||tiny) c.px.forEach(function(p){ var j=p*4; d[j]=d[j+1]=d[j+2]=bgv; });

}
// อ่านหลักตรวจสอบจากบริเวณขวาของคำตัวเลข 6 หลัก
async function readCheckDigit(img, bbox){
  var hh=bbox.y1-bbox.y0; if(hh<8) return null;
  var x0=Math.max(0,Math.round(bbox.x1+hh*0.05)), x1=Math.min(img.width,Math.round(bbox.x1+hh*2.6));
  var y0=Math.max(0,Math.round(bbox.y0-hh*0.55)), y1=Math.min(img.height,Math.round(bbox.y1+hh*0.55));
  if(x1-x0<hh*0.6) return null;
  var sc=Math.max(1,Math.min(3,120/hh)); var c=document.createElement('canvas'); c.width=Math.round((x1-x0)*sc); c.height=Math.round((y1-y0)*sc);
  c.getContext('2d').drawImage(img,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height);
  stripBox(c, hh*sc);
  var pad=document.createElement('canvas'); var m=Math.round(hh*sc*0.4); pad.width=c.width+m*2; pad.height=c.height+m*2; var pc=pad.getContext('2d');
  var bg=c.getContext('2d').getImageData(0,0,1,1).data[0]<128?'#000':'#fff'; pc.fillStyle=bg; pc.fillRect(0,0,pad.width,pad.height); pc.drawImage(c,m,m);
  var out=null;
  try{
    await OCR.worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7'});
    var r=await OCR.worker.recognize(pad); var t=(r.data.text||'').replace(/\D/g,'');
    if(t.length!==1){ await OCR.worker.setParameters({tessedit_pageseg_mode:'10'}); r=await OCR.worker.recognize(pad); t=(r.data.text||'').replace(/\D/g,''); }
    if(t.length>=1) out=t.charAt(0);
  }finally{ await OCR.worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',tessedit_pageseg_mode:'6'}); }
  return out;
}
async function ocrLocal(frame, onStep, boxAspect){
  if(!OCR.ready){ onStep&&onStep('กำลังเตรียมตัวอ่านเบอร์…'); await ocrInit(); }
  if(!OCR.ready) throw new Error('OCR บนเครื่องใช้ไม่ได้: '+OCR.err);
  var crop=cropGuide(frame, boxAspect);
  var enh=enhance(crop,false), inv=enhance(crop,true);
  var variants=[{img:enh,psm:'6'},{img:enh,psm:'7'},{img:inv,psm:'6'}];
  var near=null, t0=Date.now(), texts=[], prefixHit=null;
  for(var i=0;i<variants.length;i++){
    onStep&&onStep('OCR บนเครื่อง ('+(i+1)+'/'+variants.length+')…');
    await OCR.worker.setParameters({tessedit_pageseg_mode:variants[i].psm});
    var r=await OCR.worker.recognize(variants[i].img);
    var text=(r&&r.data&&r.data.text)||''; texts.push(text);
    var got=extractNo(text);
    if(got&&got.valid) return {ok:true,no:got.no,raw:got.raw,engine:'ocr',ms:Date.now()-t0,pass:i+1};
    if(got&&!near) near=got;
    if(!prefixHit){ var pf=findPrefix(r&&r.data&&r.data.words); if(pf) prefixHit={prefix:pf.prefix,bbox:pf.bbox,img:variants[i].img}; }
    if(Date.now()-t0>9000) break;
  }
  // หลักตรวจสอบมักอยู่ในกรอบสี่เหลี่ยมและถูก OCR ทิ้ง → อ่านซ้ำเฉพาะจุดนั้น
  if(prefixHit){
    onStep&&onStep('OCR อ่านหลักตรวจสอบ…');
    try{ var cd=await readCheckDigit(prefixHit.img, prefixHit.bbox); if(cd!=null){ var full=prefixHit.prefix+cd; if(validNo(full)) return {ok:true,no:full,raw:full,engine:'ocr',ms:Date.now()-t0,pass:'cd'}; if(!near) near={no:full,valid:false,raw:full}; } }catch(e){}
  }
  return {ok:false,near:near,engine:'ocr',ms:Date.now()-t0,texts:texts};
}
// ตัวอ่านแบบผสม: OCR บนเครื่อง → (ไม่ผ่าน) Gemini → คืนผลพร้อมสถิติ
async function readContainerNo(frame, stat, onStep, boxAspect){
  var mode=(S.boot&&S.boot.reader)||'hybrid', hasKey=!!(S.boot&&S.boot.hasKey);
  var res={no:'',valid:false,engine:'',near:'',errors:[]};
  if(mode!=='gemini'){
    stat.localTried=(stat.localTried||0)+1;
    try{ var l=await ocrLocal(frame,onStep,boxAspect); stat.localMs=(stat.localMs||0)+(l.ms||0);
      if(l.ok){ stat.localOk=(stat.localOk||0)+1; res.no=l.no; res.valid=true; res.engine='ocr'; return res; }
      if(l.near) res.near=l.near.no;
    }catch(e){ res.errors.push(String(e.message||e)); }
  }
  if(mode!=='local'){
    if(!hasKey){ res.errors.push('ยังไม่ได้ตั้ง Gemini key'); return res; }
    stat.aiTried=(stat.aiTried||0)+1;
    onStep&&onStep('OCR อ่านไม่ผ่าน กำลังให้ AI อ่าน…');
    try{
      var sc=Math.min(1,1280/Math.max(frame.width,frame.height)); var c=document.createElement('canvas'); c.width=Math.round(frame.width*sc); c.height=Math.round(frame.height*sc); c.getContext('2d').drawImage(frame,0,0,c.width,c.height);
      var b64=c.toDataURL('image/jpeg',0.8).split(',')[1];
      var r=await gs('readNumber',b64);
      if(r&&r.ok&&r.best){ if(r.best.valid){ stat.aiOk=(stat.aiOk||0)+1; res.no=r.best.no; res.valid=true; res.engine='ai'; return res; } res.near=res.near||r.best.no; }
      else if(r&&!r.ok) res.errors.push(r.error||'AI อ่านไม่ได้');
    }catch(e){ res.errors.push(String(e.message||e)); }
  }
  return res;
}

/* ================================================================== upload queue (IndexedDB) ================================================================== */
var DB={db:null};
function idb(){ return new Promise(function(res,rej){ if(DB.db) return res(DB.db); var r=indexedDB.open('yardeye2',1); r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains('jobs')) d.createObjectStore('jobs',{keyPath:'id'}); }; r.onsuccess=function(){ DB.db=r.result; res(DB.db); }; r.onerror=function(){ rej(r.error); }; }); }
function tx(fn){ return idb().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction('jobs','readwrite'); fn(t.objectStore('jobs')); t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; }); }); }
function jobPut(j){ return tx(function(st){ st.put(j); }); }
function jobDel(id){ return tx(function(st){ st.delete(id); }); }
function jobAll(){ return idb().then(function(d){ return new Promise(function(res,rej){ var r=d.transaction('jobs','readonly').objectStore('jobs').getAll(); r.onsuccess=function(){ res(r.result||[]); }; r.onerror=function(){ rej(r.error); }; }); }); }
var MAXTRY=8;
var Q={max:2,busy:false,lastErr:'',stats:{pending:0,err:0},timer:null};
function failJob(j,e){ j.tries++; j.err=String(e.message||e); j.nextAt=Date.now()+Math.min(60000,2000*Math.pow(2,j.tries)); Q.lastErr=j.err; return jobPut(j); }
function canRun(j){ return !j.done && j.tries<MAXTRY && (!j.nextAt || j.nextAt<=Date.now()); }
async function enqueueSession(ss){
  var order=0;
  for(var i=0;i<ss.photos.length;i++){ var p=ss.photos[i]; await jobPut({id:ss.sid+'_p'+(++order),type:'photo',sid:ss.sid,no:ss.no,folderId:ss.folderId||'',name:p.name,blob:p.blob,seq:order,tries:0,created:Date.now(),meta:{no:ss.no,by:S.name,kind:p.kind||'photo'}}); }
  await jobPut({id:ss.sid+'_z',type:'finish',sid:ss.sid,no:ss.no,folderId:ss.folderId||'',by:S.name,source:ss.source,reader:ss.reader,count:ss.photos.length,tries:0,created:Date.now()});
  pump();
}
async function pump(){
  if(Q.busy) return; Q.busy=true; clearTimeout(Q.timer);
  try{
    var jobs=await jobAll();
    jobs.sort(function(a,b){ return a.created-b.created || String(a.id).localeCompare(String(b.id)); });
    var photos=jobs.filter(function(j){ return j.type==='photo'; });
    var finishes=jobs.filter(function(j){ return j.type==='finish'; });
    Q.stats.pending=jobs.length; Q.stats.err=jobs.filter(function(j){ return j.tries>=MAXTRY; }).length; renderQ();
    if(navigator.onLine){
      // 1) อัปโหลดรูปพร้อมกันไม่เกิน Q.max
      var active=photos.filter(canRun).slice(0,Q.max);
      await Promise.all(active.map(uploadJob));
      // 2) ปิดตู้ที่รูปครบแล้ว
      for(var i=0;i<finishes.length;i++){
        var f=finishes[i];
        var mine=photos.filter(function(j){ return j.sid===f.sid; });
        if(mine.some(function(j){ return !j.done; })) continue;   // รอรูปให้ครบก่อน (ถ้าค้างถาวร รอคนกด "ลองส่งใหม่")
        if(!canRun(f)) continue;
        try{
          if(!f.folderId){ f.folderId=await ensureFolder(f); }
          var r=await gs('finishContainer',{sid:f.sid,no:f.no,folderId:f.folderId,by:f.by,source:f.source,reader:f.reader,fileIds:mine.map(function(j){ return j.fileId; }).filter(Boolean)});
          for(var k=0;k<mine.length;k++) await jobDel(mine[k].id);
          await jobDel(f.id);
          Q.lastErr='';
          toast('บันทึกตู้ '+f.no+' แล้ว ('+((r.entry&&r.entry.photos)||f.count)+' รูป)'+(r.merged?' · รวมกับรอบก่อนหน้าวันนี้':''),2600);
          refreshToday();
        }catch(e){ await failJob(f,e); }
      }
    }
    var left=await jobAll(); Q.stats.pending=left.length; Q.stats.err=left.filter(function(j){ return j.tries>=MAXTRY; }).length; renderQ();
    // นัดรอบถัดไปเมื่อยังมีงานที่ทำต่อได้
    var waits=left.filter(function(j){ return !j.done && j.tries<MAXTRY; }).map(function(j){ return Math.max(300,(j.nextAt||0)-Date.now()); });
    if(waits.length) Q.timer=setTimeout(pump, Math.min.apply(null,waits));

  finally{ Q.busy=false; renderQ(); }
}
var folderCache={};
async function ensureFolder(job){
  if(folderCache[job.sid]) return folderCache[job.sid];
  var r=await gs('beginContainer',{no:job.no});
  folderCache[job.sid]=r.folderId;
  var all=await jobAll(); for(var i=0;i<all.length;i++){ if(all[i].sid===job.sid && !all[i].folderId){ all[i].folderId=r.folderId; await jobPut(all[i]); } }
  return r.folderId;
}
async function uploadJob(j){
  try{
    if(!j.folderId) j.folderId=await ensureFolder(j);
    var b64=await blobToB64(j.blob);
    var r=await gs('uploadPhoto',{folderId:j.folderId,b64:b64,name:j.name,meta:j.meta});
    j.done=true; j.fileId=r.id; j.blob=null; await jobPut(j); Q.lastErr='';

}

async function boot(){

/* ================================================================== QC session ================================================================== */
function startSession(){
  S.session={sid:'s'+stamp()+'_'+Math.floor(Math.random()*9000+1000), step:'num', no:'', source:'', reader:{retakes:0}, photos:[], numberPhoto:null, folderId:'', k:0};
  render();
}
function renderSession(app){
  var ss=S.session;
  if(ss.step==='num') return screenNumberCam(app,ss);
  if(ss.step==='confirmNo') return screenConfirmNo(app,ss);
  if(ss.step==='manual') return screenManual(app,ss);
  if(ss.step==='collect') return screenCollect(app,ss);
  if(ss.step==='send') return screenSend(app,ss);
}
function camBlock(label, guide){

    '<div class="shutter"><button class="btn" id="shot" aria-label="ถ่าย"></button></div>';
}
async function mountCam(onShot, cntTxt){

  $('shot').onclick=onShot; if($('cnt')) $('cnt').textContent=cntTxt||'';
}
// 1) ถ่ายเบอร์ตู้
function screenNumberCam(app,ss){
  app.innerHTML='<div class="card" style="padding:10px"><b>ถ่ายเบอร์ตู้</b> <span class="muted">หน้าตู้หรือบนหลังคาก็ได้ ให้เบอร์อยู่ในกรอบ ชัด ไม่ย้อนแสง</span></div>'+
    camBlock('เบอร์ตู้',true)+
    '<div class="row"><button class="danger" id="cancel">ยกเลิก</button><button id="manual">คีย์เบอร์เอง</button></div>';
  mountCam(shootNumber, ss.reader.retakes?('ถ่ายใหม่ครั้งที่ '+ss.reader.retakes):'');
  $('cancel').onclick=cancelSession;
  $('manual').onclick=function(){ ss.manualFrom='cam'; ss.step='manual'; stopCam(); render(); };
}
async function shootNumber(){
  var ss=S.session; if(!ss) return;
  var vEl=$('vid'); var boxAspect=(S.cam.ok&&vEl&&vEl.clientHeight)?(vEl.clientWidth/vEl.clientHeight):0; // 0 = รูปจากกล้องเครื่อง ไม่มีกรอบ → ใช้ทั้งรูป
  var frame; try{ frame=await captureCanvas(); }catch(e){ toast('ถ่ายไม่สำเร็จ: '+(e.message||e)); return; }
  if(!frame) return;
  var thumbC=document.createElement('canvas'); var ts=Math.min(1,480/Math.max(frame.width,frame.height)); thumbC.width=Math.round(frame.width*ts); thumbC.height=Math.round(frame.height*ts); thumbC.getContext('2d').drawImage(frame,0,0,thumbC.width,thumbC.height);
  var thumb=thumbC.toDataURL('image/jpeg',0.7);
  overlay('<img src="'+thumb+'"><div class="spin"></div><div id="ovMsg">กำลังอ่านเบอร์ตู้…</div>');
  var t0=Date.now();
  var res=await readContainerNo(frame, ss.reader, function(m){ var el=$('ovMsg'); if(el) el.textContent=m; }, boxAspect);
  overlay(null);
  ss.numFrame=frame; ss.numThumb=thumb;
  ss.read={no:res.no,valid:res.valid,engine:res.engine,near:res.near,errors:res.errors,ms:Date.now()-t0};
  ss.step='confirmNo'; render();
}

// 3) คีย์เอง (ต้องผ่าน check digit เท่านั้น)
function screenManual(app,ss){
  var pre=cleanNo(ss.manualPrefill||'');

    '<div class="kbd" id="boxes"></div>'+
    '<input id="noIn" class="mono" maxlength="11" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น MSKU1234567" value="'+h(pre)+'" style="font-size:22px;text-align:center">'+

  inp.oninput=upd; upd(); setTimeout(function(){ inp.focus(); },50);
  $('okNo').onclick=function(){ var n=cleanNo(inp.value); if(!validNo(n)) return; acceptNumber(n,'manual'); };

// รับเบอร์แล้ว → เตรียมโฟลเดอร์ (ถ้าออนไลน์) → เก็บรูปเบอร์เป็นรูปแรก → หน้าเก็บรูป
async function acceptNumber(no, engine){
  var ss=S.session; if(!ss) return;
  ss.no=no; ss.source=engine==='manual'?'manual':(engine==='ai'?'ai':'ocr');
  ss.reader.engine=ss.source; ss.reader.byName=S.name;
  if(ss.numFrame){ // เก็บรูปเบอร์ตู้เป็นหลักฐานรูปแรก
    var out=await processPhoto(ss.numFrame,[no,S.name+'  '+nowTxt()]);
    ss.numberPhoto={k:++ss.k,blob:out.blob,thumb:out.thumb,name:no+'_'+stamp()+'_00_number.jpg',kind:'number'};
    ss.photos.push(ss.numberPhoto);
    ss.numFrame=null;
  }
  ss.step='collect'; render();
  try{ var r=await gs('beginContainer',{no:no}); ss.folderId=r.folderId; folderCache[ss.sid]=r.folderId; }catch(e){ /* ออฟไลน์: คิวจะสร้างโฟลเดอร์ให้เองตอนส่ง */ }
}
// 4) เก็บรูปงาน
function screenCollect(app,ss){
  app.innerHTML='<div class="card" style="padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill" style="font-size:16px">'+h(ss.no)+'</span>'+(ss.source==='manual'?'<span class="tag y">คีย์เอง</span>':ss.source==='ai'?'<span class="tag n">AI</span>':'<span class="tag g">OCR</span>')+'<span class="muted">ถ่ายรูปงานต่อเนื่อง แล้วกดส่ง</span></div>'+
    camBlock(ss.no,false)+'<div class="strip" id="strip">'+stripHtml(ss)+'</div>'+
    '<div class="row"><button class="danger" id="cancel">ยกเลิกตู้นี้</button><button class="accent" id="done" style="flex:2">ส่งข้อมูล ▸ <span id="doneN">('+workPhotos(ss).length+' รูป)</span></button></div>';
  mountCam(shootWork, cntTxt(ss));

}
function workPhotos(ss){ return ss.photos.filter(function(p){ return p.kind!=='number'; }); }
function cntTxt(ss){ return workPhotos(ss).length+' รูป'; }
function stripHtml(ss){ var ps=ss.photos.slice().reverse(); return ps.length?ps.map(function(p){ return '<div class="th" data-k="'+p.k+'"><img src="'+p.thumb+'">'+(p.kind==='number'?'<div class="b">เบอร์ตู้</div>':'<span class="x" data-x="'+p.k+'">✕</span>')+'</div>'; }).join(''):'<div class="muted" style="padding:20px 6px">ยังไม่มีรูป</div>'; }
function bindStrip(ss){ var st=$('strip'); if(!st) return; st.onclick=async function(e){ var k=e.target.getAttribute('data-x'); if(k==null) return; if(!await ask('ลบรูปนี้?')) return; ss.photos=ss.photos.filter(function(p){ return String(p.k)!==k; }); softRefresh(ss); }; }
function softRefresh(ss){ var st=$('strip'); if(st) st.innerHTML=stripHtml(ss); if($('cnt')) $('cnt').textContent=cntTxt(ss); if($('doneN')) $('doneN').textContent='('+workPhotos(ss).length+' รูป)'; }

}

function dateInputs(id,days,label){ var to=todayIso(); var f=new Date(Date.now()-(days-1)*86400000); var from=f.getFullYear()+'-'+p2(f.getMonth()+1)+'-'+p2(f.getDate());

function rng(id){ var f=$(id+'From').value, t=$(id+'To').value; if(f>t){ var x=f; f=t; t=x; } return [f,t]; }

function bindPhotoLinks(root){ root.querySelectorAll('[data-f]').forEach(function(a){ a.onclick=function(ev){ ev.preventDefault(); showPhotos(a.getAttribute('data-f')); }; }); }
function csvDownload(name, rows){ var csv='﻿'+rows.map(function(l){ return l.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n'); var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

async function adminStats(body){
  body.innerHTML='<div class="card"><h2>สถิติการอ่านเบอร์ตู้</h2><div class="muted">ใช้ตัดสินว่า OCR ฟรีพอไหม หรือควรเปิด AI — ดูจากสัดส่วนที่อ่านผ่านครั้งแรก / ต้องถ่ายใหม่ / ต้องคีย์เอง</div>'+dateInputs('s',7)+'<div id="sRes" style="margin-top:12px"></div></div>';

<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Yard Eye"><meta name="theme-color" content="#5C2E0E">
<title>NOVA Yard Eye</title><style>body{margin:0;background:#F7F1E7;color:#2B1D12;font-family:system-ui,sans-serif}#ld{padding:40px 20px;text-align:center}#ld button{font-size:17px;padding:12px 20px;border:0;border-radius:12px;background:#5C2E0E;color:#fff}</style></head>
<body><div id="ld">กำลังเปิด NOVA Yard Eye…</div><script>
var API="https://script.google.com/macros/s/AKfycbwEroBi0p3vnCZdr8kDeWd25GtsPRE0r4UeW4TsL97LxmN8sr6LQDe9fQjpgG9sKw5fHQ/exec";
function show(html){document.open();document.write(html);document.close();}
function good(t){return typeof t==="string"&&t.indexOf("<!DOCTYPE html>")===0&&t.indexOf("NOVA Yard Eye")>0&&t.length>20000;}
function fetchLatest(){return fetch(API+"?api=index&_="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){if(!good(t))throw new Error("bad");try{localStorage.setItem("ye_html",t);}catch(e){}return t;});}
(function(){var cached=null;try{cached=localStorage.getItem("ye_html");}catch(e){}
if(good(cached)){fetchLatest().catch(function(){});show(cached);return;}
fetchLatest().then(show).catch(function(e){document.getElementById("ld").innerHTML="เปิดแอปไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่<br><br><button id='rt'>ลองใหม่</button>";document.getElementById("rt").onclick=function(){location.reload();};});
})();</script></body></html>
